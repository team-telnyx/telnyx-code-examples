# Generated by `telnyx-edge dev` (COMPUTE-222). DO NOT EDIT — re-run `telnyx-edge dev`.
#
# Local StatefulActor dev stack for this telnyx.toml project:
#   postgres          Dapr actor state store (state.postgresql)
#   placement         Dapr Placement (actor type -> host routing)
#   scheduler         Dapr Scheduler (actor alarms)
#   function-net      owns the function-runtime + function-sidecar network namespace
#   function-runtime  hosts the project's fetch handler; env.<BINDING> -> actors
#   function-sidecar  daprd paired to function-runtime
# and, for each actor type, as in production (one Deployment per type):
#   actor-rt-<type>-<hash>-net      owns that type's runtime + sidecar network namespace
#   actor-rt-<type>-<hash>-runtime  hosts that one StatefulActor class, with its actor-scoped env
#   actor-rt-<type>-<hash>-sidecar  daprd paired to it (app-id actor-rt-<type>-<hash>)
#
# Both kinds of runtime load the staged bundle at /app/customer/index.js. The
# function runtime reads the mounted project telnyx.toml; each actor runtime
# reads a generated manifest naming only its own type (./actors). Hit your
# function at http://127.0.0.1:8787 (loopback only).
#
# Local state lives in three named volumes (actor-state: KV, actor-data: SQL,
# scheduler-data: alarms). They survive re-running dev and a plain `down`;
# `down -v` deletes all three together.
name: telnyx-dev-dispatch-line-1e7641c6

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: actorstate
    volumes:
      - actor-state:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 2s
      timeout: 2s
      retries: 10

  placement:
    image: daprio/dapr:1.18.1
    command: ["./placement", "-port", "50005", "-log-level", "info"]

  # The scheduler keeps alarms in its embedded etcd, on the scheduler-data
  # volume so they survive a restart. It runs as root because the dapr image's
  # non-root user cannot write a freshly created (root-owned) named volume;
  # nothing here is reachable from outside the compose network.
  scheduler:
    image: daprio/dapr:1.18.1
    user: "0:0"
    command:
      - "./scheduler"
      - "--port"
      - "50006"
      - "--listen-address"
      - "0.0.0.0"
      - "--override-broadcast-host-port"
      - "scheduler:50006"
      - "--etcd-data-dir"
      - "/scheduler-data"
      - "--log-level"
      - "info"
    volumes:
      - scheduler-data:/scheduler-data

  # The *-net services own each runtime+sidecar pair's network
  # namespace, like a Kubernetes pod's pause container (COMPUTE-1185). Runtime
  # and sidecar both join it, so restarting a runtime or sidecar by any route
  # (compose restart, stop/start, plain docker restart, hot reload) rejoins a
  # namespace that never changed. Previously the sidecar joined the runtime's
  # namespace, and a hand-restart of the runtime stranded it (DNS refused,
  # daprd unreachable). The holder itself is the one thing not to restart by
  # hand: `docker compose restart <holder>` restarts its members too
  # (restart: true below), but a plain `docker restart` of a holder strands
  # them as before — re-run dev to recover. Reuses the already-pulled postgres
  # image: no extra pull.
  # sleep as PID 1 ignores SIGTERM, so SIGKILL keeps `down` fast.
  #
  # Each actor runtime, per type:
  # - POD_IP: production injects the pod IP via the k8s downward API
  #   (status.podIP); compose has no downward API, so the wrapper reads the
  #   container's own address at start. The actor self-reports "<POD_IP>:8081"
  #   as its WebSocket dial target — without it every local WS upgrade fails
  #   the resolve step (COMPUTE-449). Mirrors edge-compute-statefulactor's
  #   infra/dev-stack/docker-compose.ws-echo.yaml overlay. Deliberate
  #   trade-off: this couples the stack to the actor-runtime image contract
  #   (CMD "node dist/main.js", /bin/sh + busybox in node:alpine) — an
  #   --actor-image override must be an actor-runtime build (the flag help
  #   says so); compose cannot wrap a command while preserving an arbitrary
  #   image CMD, and the alternative (runtime-side POD_IP autodetect) would
  #   silently break new-CLI + old-image combinations. hostname -i resolves
  #   the holder's address (the shared namespace).
  # - PATH is the image's own, pinned: the type's actor-scoped [env_vars]
  #   follow it, and a customer PATH must not hide node (the SQLite sidecar
  #   spawn), hostname/awk (the wrapper) or wget (the healthcheck).
  # - TELNYX_CONFIG_PATH is a generated manifest naming only this type, so the
  #   runtime hosts (and advertises to placement) this type alone.
  #   TELNYX_RUNTIME_BINDINGS carries every [[actors]] binding, so env.<OTHER>
  #   still reaches the other types' runtimes through placement.
  # - actor-data holds the SQLite sidecar's per-actor databases
  #   (TELNYX_ACTOR_DATA_DIR, default /data), one file per type and id, so the
  #   types share the volume without overlapping. Production snapshots them to
  #   object storage; locally there is none, so without a volume every hot
  #   reload (a recreated container) would wipe ctx.storage.sql.
  # - Ready when the actor app answers its reserved /healthz (no customer code)
  #   AND its Dapr sidecar is up (metadata = registered with placement). wget
  #   is busybox (in the node image); /v1.0/metadata returns 200+JSON, avoiding
  #   the 204 the sidecar /healthz returns.
  # - restart: true makes `docker compose restart <holder>` also restart
  #   the services that joined it.

  # Actor type DispatchLine.
  actor-rt-dispatchline-b1463fc1-net:
    image: postgres:16-alpine
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    # The postgres image declares VOLUME /var/lib/postgresql/data; mask it
    # with a tmpfs so a holder gets no anonymous volume for a plain down to
    # orphan.
    tmpfs:
      - /var/lib/postgresql/data

  actor-rt-dispatchline-b1463fc1-runtime:
    image: ghcr.io/team-telnyx/edge-compute/actor-runtime:sha-d9144b8
    network_mode: "service:actor-rt-dispatchline-b1463fc1-net"
    command:
      - /bin/sh
      - -c
      - export POD_IP="$$(hostname -i | awk '{print $$1}')" && exec node dist/main.js
    environment:
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      PORT: "3000"
      DAPR_HTTP_PORT: "3500"
      TELNYX_CONFIG_PATH: /app/telnyx.toml
      ACTOR_ENTRY: /app/customer/index.js
      SQLITE_SIDECAR_PORT: "3602"
      TELNYX_ACTOR_STATE_STORE: "statestore"
      TELNYX_RUNTIME_BINDINGS: "[{\"binding\":\"DISPATCH\",\"type\":\"actor\",\"actor_type\":\"DispatchLine\"},{\"binding\":\"SHIFT_DB\",\"type\":\"sqldb\",\"actor_type\":\"telnyx_sqldb\",\"namespace_id\":\"7b9d0f80-394b-4279-90eb-0fc31297d79a\"}]"
    volumes:
      - ../build:/app/customer:ro
      - ./actors/actor-rt-dispatchline-b1463fc1.toml:/app/telnyx.toml:ro
      - actor-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz && wget -q -O /dev/null http://127.0.0.1:3500/v1.0/metadata"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s
    depends_on:
      actor-rt-dispatchline-b1463fc1-net:
        condition: service_started
        restart: true
      postgres:
        condition: service_healthy

  actor-rt-dispatchline-b1463fc1-sidecar:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "-app-id"
      - "actor-rt-dispatchline-b1463fc1"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "placement:50005"
      - "-scheduler-host-address"
      - "scheduler:50006"
      - "-components-path"
      - "/dapr-components"
      - "-log-level"
      - "info"
    network_mode: "service:actor-rt-dispatchline-b1463fc1-net"
    volumes:
      - ./dapr-components:/dapr-components:ro
    depends_on:
      actor-rt-dispatchline-b1463fc1-net:
        condition: service_started
        restart: true
      actor-rt-dispatchline-b1463fc1-runtime:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started

  # SQL-database host for [storage.sqldb] (COMPUTE-675): the actor-runtime
  # image booted as the built-in telnyx_sqldb type, as production deploys it.
  # env.<BINDING> reaches it by an actor invoke of the database id, as a
  # deployed function does. Its databases are files in the project's
  # .telnyx/sqldb (bind-mounted, not a volume): the same files
  # `storage sqldb execute <db> --local` reads and writes, so they persist across
  # `down -v` and are shared with the CLI. No customer bundle or manifest.
  actor-rt-telnyx-sqldb-a13f1013-net:
    image: postgres:16-alpine
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    tmpfs:
      - /var/lib/postgresql/data

  actor-rt-telnyx-sqldb-a13f1013-runtime:
    image: ghcr.io/team-telnyx/edge-compute/actor-runtime:sha-d9144b8
    network_mode: "service:actor-rt-telnyx-sqldb-a13f1013-net"
    command:
      - /bin/sh
      - -c
      - export POD_IP="$$(hostname -i | awk '{print $$1}')" && exec node dist/main.js
    environment:
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      PORT: "3000"
      DAPR_HTTP_PORT: "3500"
      # No SQLITE_SIDECAR_PORT, unlike the customer actor runtimes: the runtime
      # exempts the built-in SQL host (actor-runtime/src/main.ts), whose pool
      # assigns a sidecar port per child (COMPUTE-682).
      TELNYX_BUILTIN_ACTOR_TYPE: "telnyx_sqldb"
      TELNYX_SQL_ENGINE: "metered"
      TELNYX_ACTOR_DATA_DIR: /data
      TELNYX_ACTOR_STATE_STORE: "statestore"
    volumes:
      - type: bind
        source: "/Users/sonamgupta/telnyx-code-examples/.worktrees/dispatch-line/dispatch-line/.telnyx/sqldb"
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz && wget -q -O /dev/null http://127.0.0.1:3500/v1.0/metadata"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s
    depends_on:
      actor-rt-telnyx-sqldb-a13f1013-net:
        condition: service_started
        restart: true
      postgres:
        condition: service_healthy

  actor-rt-telnyx-sqldb-a13f1013-sidecar:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "-app-id"
      - "actor-rt-telnyx-sqldb-a13f1013"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "placement:50005"
      - "-scheduler-host-address"
      - "scheduler:50006"
      - "-components-path"
      - "/dapr-components"
      - "-log-level"
      - "info"
    network_mode: "service:actor-rt-telnyx-sqldb-a13f1013-net"
    volumes:
      - ./dapr-components:/dapr-components:ro
    depends_on:
      actor-rt-telnyx-sqldb-a13f1013-net:
        condition: service_started
        restart: true
      actor-rt-telnyx-sqldb-a13f1013-runtime:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started

  function-net:
    image: postgres:16-alpine
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    tmpfs:
      - /var/lib/postgresql/data
    # Loopback only: the function (and every binding it holds) is not
    # reachable from the rest of the network.
    ports:
      - "127.0.0.1:8787:3000"

  function-runtime:
    image: ghcr.io/team-telnyx/edge-compute/function-runtime:sha-d9144b8
    network_mode: "service:function-net"
    environment:
      PORT: "3000"
      DAPR_HTTP_PORT: "3500"
      DAPR_HOST: 127.0.0.1
      TELNYX_CONFIG_PATH: /app/telnyx.toml
      FUNCTION_ENTRY: /app/customer/index.js
      TELNYX_RUNTIME_BINDINGS: "[{\"binding\":\"SHIFT_DB\",\"type\":\"sqldb\",\"actor_type\":\"telnyx_sqldb\",\"namespace_id\":\"7b9d0f80-394b-4279-90eb-0fc31297d79a\"}]"
      "DEMO_MODE": "true"
    volumes:
      - ../build:/app/customer:ro
      - ../../telnyx.toml:/app/telnyx.toml:ro
    # The function runtime routes every path to the customer handler, so it has
    # no probe-able health route — gate on its Dapr sidecar instead (the path
    # env.<BINDING> calls travel). Avoids invoking customer code on startup.
    healthcheck:
      # PATH is pinned: the function runtime gets the customer's [env_vars],
      # and a customer PATH must not hide wget from the healthcheck.
      test: ["CMD-SHELL", "PATH=/usr/sbin:/usr/bin:/sbin:/bin wget -q -O /dev/null http://127.0.0.1:3500/v1.0/metadata"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s
    depends_on:
      function-net:
        condition: service_started
        restart: true
      actor-rt-dispatchline-b1463fc1-runtime:
        condition: service_started
      actor-rt-telnyx-sqldb-a13f1013-runtime:
        condition: service_started

  function-sidecar:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "-app-id"
      - "function-runtime"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "placement:50005"
      - "-scheduler-host-address"
      - "scheduler:50006"
      - "-components-path"
      - "/dapr-components"
      - "-log-level"
      - "info"
    network_mode: "service:function-net"
    volumes:
      - ./dapr-components:/dapr-components:ro
    depends_on:
      function-net:
        condition: service_started
        restart: true
      function-runtime:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started

volumes:
  actor-state:
  actor-data:
  scheduler-data:
