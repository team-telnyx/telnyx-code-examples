name = "expressive-voice-reminder"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[actors]]
name = "REMINDERS"
class_name = "ReminderQueue"

[[secrets]]
binding = "TELNYX_API_KEY"

[[secrets]]
binding = "OUTBOUND_TEXML_APP_ID"

[[secrets]]
binding = "OUTBOUND_CALLER_ID"

[[secrets]]
binding = "CLINIC_TIMEZONE"

[[secrets]]
binding = "RETRY_MAX"

[[secrets]]
binding = "RETRY_BACKOFF_BASE_MS"

[[secrets]]
binding = "MAX_CALL_MINUTES"
