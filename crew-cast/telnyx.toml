name = "crew-cast"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[edge_compute]
func_id   = "b5b4a657-a21d-46d8-a710-8e24f35220a4"
func_name = "crew-cast"

# The durable crew thread. One actor instance per job id (e.g. "job-1187").
[[actors]]
binding = "CREW_CAST"
type    = "CrewCast"

# Zero-credential Telnyx API binding (platform injects auth at deploy time).
[telnyx]
binding = "TELNYX"

# Agent SQL: backs the acknowledgement report returned by GET /board.
[storage.sqldb.CREW_DB]
id = "49e92c06-d325-445d-b359-95c68c1c3097"

# KV index: group_message_id -> cast_id (finalized routing) and
# crew number -> cast_id (inbound reply routing).
[storage.kv.CREW_INDEX]
id = "ab88bae8-dda0-4433-b43b-99cbbc17c636"

[[secrets]]
binding = "TELNYX_API_KEY"
name    = "TELNYX_API_KEY"

# Telnyx webhook signing public key (Ed25519). Required in live mode.
[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name    = "TELNYX_PUBLIC_KEY"

# Standard-Webhooks HMAC secret (v1) for this messaging profile — the profile
# API exposes it as `v1_secret`. Backs the webhook-signature header.
[[secrets]]
binding = "TELNYX_WEBHOOK_V1_SECRET"
name    = "TELNYX_WEBHOOK_V1_SECRET"

# Live-mode configuration, readable by the actor via env.SECRETS.get()
# (actor pods do not receive [env_vars]; org secrets are injected everywhere).
[[secrets]]
binding = "DEMO_MODE"
name    = "DEMO_MODE"

[[secrets]]
binding = "CREW_FROM"
name    = "CREW_FROM"

[[secrets]]
binding = "CREW_PROFILE_ID"
name    = "CREW_PROFILE_ID"

[[secrets]]
binding = "DISPATCH_PHONE"
name    = "DISPATCH_PHONE"

[[secrets]]
binding = "PUBLIC_BASE_URL"
name    = "PUBLIC_BASE_URL"

[[secrets]]
binding = "CREW_TO_1"
name    = "CREW_TO_1"

[[secrets]]
binding = "CREW_TO_2"
name    = "CREW_TO_2"

[[secrets]]
binding = "CREW_TO_3"
name    = "CREW_TO_3"

[[secrets]]
binding = "CREW_TO_4"
name    = "CREW_TO_4"

[[secrets]]
binding = "CREW_TO_5"
name    = "CREW_TO_5"

[[secrets]]
binding = "CREW_TO_6"
name    = "CREW_TO_6"

[env_vars]
DEMO_MODE = "false"
CREW_FROM = "+16288959457"
CREW_PROFILE_ID = "<messaging-profile-id>"
DISPATCH_PHONE = "+1555XXXXXXXX"
PUBLIC_BASE_URL = "https://crew-cast-b5b4a657-a.telnyxcompute.com"
CREW_TO_1 = "+1555XXXXXXX1"
CREW_TO_2 = "+1555XXXXXXX2"
CREW_TO_3 = "+1555XXXXXXX3"
CREW_TO_4 = "+1555XXXXXXX4"
CREW_TO_5 = "+1555XXXXXXX5"
CREW_TO_6 = "+1555XXXXXXX6"
