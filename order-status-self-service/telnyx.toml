# Order Status Self-Service — Telnyx Edge Compute (Stateful Actors).
#
# One durable actor instance per customer E.164: the actor owns the customer's
# order state (per-actor SQL), the SMS conversation memory (MessageLog), and
# the proactive delay notification (scheduled task + exactly-once guard).
#
# Bindings:
#   [[actors]]  CUSTOMERS — the OrderAgent durable namespace. One actor per
#                         customer, addressed via idFromName(customerE164).
#   [telnyx]    TELNYX    — the standard Telnyx SDK binding. Exposes
#                         this.env.TELNYX.messages.send() and
#                         this.env.TELNYX.ai.openai.chat.createCompletion().
#                         Declaring this block also injects TELNYX_API_KEY.
#   [[secrets]]           — config values registered per-account via
#                         `telnyx-edge secrets add`. NOTE: the Edge runtime
#                         does NOT inject [env_vars] for actor projects —
#                         config must ship as [[secrets]] bindings and is
#                         read via SECRETS.get() with a plain env-var fallback
#                         (see readConfig in src/index.ts).
#
# Secrets (register with `telnyx-edge secrets add <name> <value>`):
#   DEMO_MODE              — "true" (default) logs SMS + uses the deterministic
#                            demo interpreter; "false" sends real SMS and calls
#                            Telnyx-hosted inference.
#   TELNYX_SMS_FROM_NUMBER — SMS-capable sender number in E.164 (required for
#                            live SMS; the default edge messaging profile has
#                            no numbers, so fromless sends fail).
#   AI_MODEL               — Telnyx-hosted inference model
#                            (default zai-org/GLM-5.3-Flash).

name = "order-status-self-service"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ── Function identity (created via `telnyx-edge new-func --actor -l ts -n order-status-self-service`) ──
[edge_compute]
func_id = "c51e50c7-2d7d-42e6-87c0-82b52402cc72"
func_name = "order-status-self-service"

[[actors]]
binding = "CUSTOMERS"
type = "OrderAgent"

[telnyx]
binding = "TELNYX"

[[secrets]]
binding = "DEMO_MODE"
name = "DEMO_MODE"

[[secrets]]
binding = "TELNYX_SMS_FROM_NUMBER"
name = "TELNYX_SMS_FROM_NUMBER"

[[secrets]]
binding = "AI_MODEL"
name = "AI_MODEL"
