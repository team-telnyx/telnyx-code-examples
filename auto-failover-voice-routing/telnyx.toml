name = "auto-failover-voice-routing"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# ── Stateful actor: one FailoverAgent instance owns the breaker + call flow ──
[[actors]]
binding = "FAILOVER_AGENT"
type = "FailoverAgent"

# ── Telnyx API binding: pre-authenticated SDK client (env.TELNYX) ──────────
# Used for Call Control (dial, speak, gather, hangup) and Messaging (SMS).
[edge_compute]
func_id = "replace-after-telnyx-edge-new-func"
func_name = "auto-failover-voice-routing"

[telnyx]
binding = "TELNYX"

# ── Telnyx KV: durable circuit-breaker state + call routing maps (env.FAILOVER_KV) ──
# Create the namespace first:
#   telnyx-edge storage kv create --name auto-failover-breaker
# Then paste the returned id below.
[storage.kv.FAILOVER_KV]
id = "24ef6983-ceb5-4406-986e-0f7bd50e1bc8"

# ── Secrets ────────────────────────────────────────────────────────────────
[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name = "TELNYX_PUBLIC_KEY"

# ── Env vars (non-secret config) ───────────────────────────────────────────
[env_vars]
DEMO_MODE = "true"
TELNYX_PRIMARY_CONNECTION_ID = "your_primary_call_control_app_id"
TELNYX_BACKUP_CONNECTION_ID = "your_backup_call_control_app_id"
TELNYX_FROM_NUMBER = "+15550001000"
SMS_FROM_NUMBER = "+15550002000"
TELNYX_OPS_ALERT_NUMBER = "+15550003000"
FAILURE_THRESHOLD = "3"
COOLDOWN_SECONDS = "45"
DIAL_TIMEOUT_SECS = "20"
TTS_VOICE = "Telnyx.Ultra.f786b574-daa5-4673-aa0c-cbe3e8534c02"
