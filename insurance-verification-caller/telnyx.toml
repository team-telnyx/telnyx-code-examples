name = "insurance-verification-caller"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[edge_compute]
func_id = "<your-edge-function-id>"
func_name = "insurance-verification-caller"

[[actors]]
binding = "VERIFY_JOB"
type = "VerifyJob"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[[secrets]]
binding = "CARRIER_E164"
name = "CARRIER_E164"

[[secrets]]
binding = "MOCK_CARRIER_E164"
name = "MOCK_CARRIER_E164"

[[secrets]]
binding = "CARRIER_NUMBER_ID"
name = "CARRIER_NUMBER_ID"

[[secrets]]
binding = "OUTBOUND_CALLER_ID"
name = "OUTBOUND_CALLER_ID"

[[secrets]]
binding = "FRONTDESK_E164"
name = "FRONTDESK_E164"

[[secrets]]
binding = "VM_KEYWORDS"
name = "VM_KEYWORDS"

[[secrets]]
binding = "MAX_ATTEMPTS"
name = "MAX_ATTEMPTS"

[[secrets]]
binding = "JEV_MODEL"
name = "JEV_MODEL"

[[secrets]]
binding = "JEV_ENDPOINT"
name = "JEV_ENDPOINT"

[telnyx]
binding = "TELNYX"

[env_vars]
CARRIER_E164 = "+15555550100"
MOCK_CARRIER_E164 = "+15555550101"
CARRIER_NUMBER_ID = "<your-telnyx-number-resource-id>"
OUTBOUND_CALLER_ID = "+15555550102"
FRONTDESK_E164 = "+15555550103"
HOLD_MAX_MS = "180000"
ANSWER_SILENCE_MS = "4000"
VM_KEYWORDS = "voicemail,leave a message,after the tone"
MENU_LOOP_MAX = "3"
MAX_ATTEMPTS = "3"
JEV_MODEL = "telnyx/decision-flash"
JEV_ENDPOINT = "https://api.telnyx.com/v2/ai/typesafe/v1/systemone"
DEMO_MODE = "false"
