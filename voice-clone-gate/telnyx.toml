```toml
name = "voice-clone-gate"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[[actors]]
binding = "GATES"
type = "VoiceGate"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[telnyx]
binding = "TELNYX"

[storage.sqldb.GATE_DB]
id = "<sqldb-namespace-uuid>"

[env_vars]
OUTBOUND_CONNECTION_ID = "<connection_id>"
OUTBOUND_CALLER_ID = "+1555XXXXXXXX"
DF_TIMEOUT_S = "15"
DF_RTP_TIMEOUT_S = "30"
STRIKE_LIMIT = "2"
INCIDENT_SMS_E164 = "+1555XXXXXXXX"
DIAL_WINDOW_START = "09:00"
DIAL_WINDOW_END = "17:00"
INCONCLUSIVE_RETRY_MAX = "1"
MAX_CALL_MINUTES = "600"
DEMO_MODE = "true"
```
