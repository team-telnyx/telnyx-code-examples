name = "candidate-screening-call-agent"
main = "src/index.ts"
compatibility_date = "2026-10-08"

[[actors]]
binding = "SCREENS"
type = "CandidateScreen"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name = "TELNYX_PUBLIC_KEY"

[edge_compute]
func_id = "replace-with-your-function-id"
func_name = "anusha-candidate-screening-call-agent"

[env_vars]
OUTBOUND_TEXML_APP_ID = "00000000-0000-0000-0000-000000000000"
OUTBOUND_CALLER_ID = "+15551234567"
WEBHOOK_TOOL_URL = "https://your-deployment.example.com/screen/score"
SCREEN_RETRY_MAX = "2"
MAX_CALL_MINUTES = "12"
