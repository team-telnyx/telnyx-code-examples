name = "agent-fleet"
main = "src/index.ts"
compatibility_date = "2026-07-28"

# One actor type per project \u2014 the same shape `telnyx-acp deploy` produces
# for a config-only agent (one function, one actor type, one address).
[[actors]]
binding = "SUPPORT"
type = "SupportAgent"

[[actors]]
binding = "SALES"
type = "SalesAgent"

[[actors]]
binding = "SCHEDULING"
type = "SchedulingAgent"

# Zero-credential Telnyx API binding: messaging + Telnyx Inference.
[telnyx]
binding = "TELNYX"

# Project records, Agent Memory profiles, log lines and run traces.
[storage.kv.FLEET_KV]
id = "<kv-namespace-uuid>"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name = "TELNYX_PUBLIC_KEY"

[env_vars]
AI_MODEL = "meta-llama/Llama-3.3-70B-Instruct"
DEMO_MODE = "true"
AGENT_NUMBER = "+1555XXXXXXXX"
