```toml
name = "dial-in-interview-scorer"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[[actors]]
binding = "INTERVIEWS"
type = "InterviewCall"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[telnyx]
binding = "TELNYX"

[storage.sqldb.SCORECARD_DB]
id = "<sqldb-namespace-uuid>"

[env_vars]
OUTBOUND_CONNECTION_ID = "<your_call_control_connection_id>"
OUTBOUND_CALLER_ID = "<your_voice_number_e164>"
DASHBOARD_ORIGIN = "https://localhost:3000"
MAX_CALL_MINUTES = "1800"
RESUME_RETRY_MAX = "3"
ANSWER_SILENCE_MS = "3000"
DECISION_TIMEOUT_MS = "8000"
```
