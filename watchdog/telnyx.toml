name = "watchdog"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[edge_compute]
func_id   = "<func-uuid>"
func_name = "watchdog"

# The durable watchdog. One actor instance per watched hostname.
[[actors]]
binding = "WATCHDOG"
type    = "Watchdog"

# Zero-credential Telnyx API binding (platform injects auth at deploy time).
[telnyx]
binding = "TELNYX"

# Run + incident ledger owned by the watchdog actor.
[storage.sqldb.WATCHDOG_DB]
id = "<sqldb-namespace-uuid>"

# KV routing index: watch -> owner phone, owner -> watch ids, incident -> watch id.
[storage.kv.WATCHDOG_INDEX]
id = "<kv-namespace-uuid>"

[[secrets]]
binding = "TELNYX_API_KEY"
name    = "TELNYX_API_KEY"

# Telnyx webhook signing public key (Ed25519). Required in live mode.
[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name    = "TELNYX_PUBLIC_KEY"

# Edge env_vars do not reach the actor runtime, so the knobs are declared as
# secrets (read via SECRETS with env/process fallbacks in setting()).
[[secrets]]
binding = "DEMO_MODE"
name    = "DEMO_MODE"

[[secrets]]
binding = "WATCH_TARGET_URL"
name    = "WATCH_TARGET_URL"

[[secrets]]
binding = "WATCH_OWNER_PHONE"
name    = "WATCH_OWNER_PHONE"

[[secrets]]
binding = "FROM_NUMBER"
name    = "FROM_NUMBER"

[[secrets]]
binding = "AI_MODEL"
name    = "AI_MODEL"

# Documented defaults (apply when a knob is unset):
[env_vars]
DEMO_MODE = "true"
AI_MODEL = "moonshotai/Kimi-K3"
WATCH_TARGET_URL = "https://your-fixture-host.example.com/"
WATCH_OWNER_PHONE = "+1555XXXXXXX"
FROM_NUMBER = "+1555XXXXXXX"
