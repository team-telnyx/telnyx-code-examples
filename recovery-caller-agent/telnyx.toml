```toml
name = "recovery-caller-agent"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[[actors]]
binding = "FOLLOWUPS"
type = "RecoveryCall"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[telnyx]
binding = "TELNYX"

[storage.sqldb.FOLLOWUPS_DB]
id = "<sqldb-namespace-uuid>"

[env_vars]
OUTBOUND_CONNECTION_ID = "<your_connection_id>"
OUTBOUND_CALLER_ID = "+1555XXXXXXXX"
CLINIC_E164 = "+1555XXXXXXXX"
FRONTDESK_E164 = "+1555XXXXXXXX"
D1_DELAY_H = "24"
D7_DELAY_H = "168"
D14_DELAY_H = "336"
RESUME_RETRY_MAX = "2"
RED_FLAG_NOUL = "0.8"
SEVERITY_ESCALATE = "3"
ANSWER_SILENCE_MS = "3000"
```
