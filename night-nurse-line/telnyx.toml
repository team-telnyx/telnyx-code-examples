name = "night-nurse-line"
main = "src/index.ts"
compatibility_date = "2026-07-28"

[edge_compute]
func_id   = "<func-uuid>"
func_name = "night-nurse-line"

# One durable NightNurse actor per patient handle (env.NURSES.idFromName("maya-481")).
[[actors]]
binding = "NURSES"
type = "NightNurse"

# Single-purpose on-call rota desk (env.ROTAS.idFromName("oncall")).
[[actors]]
binding = "ROTAS"
type = "RotaDesk"

# Relay-side clinic desk: clinic-wide ledger + the daily handoff SMS.
[[actors]]
binding = "CLINIC"
type = "ClinicDesk"

# Zero-credential Telnyx API binding (messages.send).
[telnyx]
binding = "TELNYX"

# Shared agent SQL: patient_chart, sessions, pages, rota.
[storage.sqldb.CLINIC_DB]
id = "<sqldb-namespace-uuid>"

[[secrets]]
binding = "TELNYX_API_KEY"
name = "TELNYX_API_KEY"

[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name = "TELNYX_PUBLIC_KEY"

[[secrets]]
binding = "NIGHT_NURSE_ASSISTANT_ID"
name = "NIGHT_NURSE_ASSISTANT_ID"

[[secrets]]
binding = "ONCALL_E164"
name = "ONCALL_E164"

[[secrets]]
binding = "DAY_TEAM_E164"
name = "DAY_TEAM_E164"

[[secrets]]
binding = "FROM_E164"
name = "FROM_E164"

[[secrets]]
binding = "DEMO_MODE"
name = "DEMO_MODE"
